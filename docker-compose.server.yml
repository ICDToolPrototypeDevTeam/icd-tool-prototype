# 服务器单端口交付形态：一个后端容器 + 一个 Mongo 容器（账号库）。
# 对外只有一个端口 8182（后端同时提供 API 与前端页面）；Mongo 不映射宿主端口。
#
# 与本地开发用的 docker-compose.yml 的区别：
#   - 无 build 段：镜像在外部构建后 docker load 进来，服务器无需联网构建；
#   - 无前端容器：前端构建产物由后端同源托管（ICD_STATIC_DIR），对外只暴露 8182
#     一个端口（映射到容器内 8000；容器内服务端口不变）；
#   - Mongo 不映射宿主端口，只允许 compose 内部网络访问，并限制内存上限。
#
# 使用前提（与仓库目录结构保持一致，交付时请原样带过去）：
#   frontend/dist/        前端构建产物（npm run build 生成）
#   backend/.env          模型服务配置 + 认证配置（MONGO_URL / AUTH_JWT_SECRET 等）
#   backend/output/       分析输出落盘目录
#   根目录 .env           容器内存上限与镜像标签（ICD_MEM_LIMIT / ICD_MEMSWAP_LIMIT /
#                         MONGO_MEM_LIMIT / MONGO_IMAGE）
#
# 部署步骤与验收方式见 部署说明.md。
#
# 独立项目名：避免与本地开发的 docker-compose.yml（项目名默认取目录名）互相覆盖容器。
name: icd-tool-server

services:
  mongo:
    # 离线交付：镜像已随包提供（mongo-image.tar.gz），服务器上先 docker load。
    # 变量 MONGO_IMAGE 默认与 scripts/build-image.sh 的默认值保持一致。
    image: ${MONGO_IMAGE:-mongo:7.0.14}
    # 内网服务器无外网出口：镜像缺失时直接报错，而不是尝试联网拉取
    pull_policy: never
    restart: unless-stopped
    # 不映射宿主端口：只有 backend 容器能通过服务名 mongo 访问。
    volumes:
      - mongo_data:/data/db
    # 账号库内存上限：默认 1 GB，从整机内存预算中扣除；按服务器内存调整时
    # 写进部署目录根 .env（MONGO_MEM_LIMIT）。memswap_limit 与 mem_limit 相等
    # = Mongo 容器不允许用 swap，避免内存压力下整机假死。
    mem_limit: ${MONGO_MEM_LIMIT:-1g}
    memswap_limit: ${MONGO_MEM_LIMIT:-1g}
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: icd-tool-backend-v4.0
    # 内网服务器无外网出口：镜像缺失时直接报错，而不是尝试联网拉取
    pull_policy: never
    ports:
      # 宿主机 8182 → 容器内 8000（容器内 uvicorn 仍监听 8000）
      - '8182:8000'
    volumes:
      # 前端产物只读挂载，后端按 ICD_STATIC_DIR 同源托管
      - ./frontend/dist:/app/static:ro
      # 分析输出落宿主机，容器重建不丢
      - ./backend/output:/app/output
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ICD_STATIC_DIR=/app/static
      # 容器内后端走 compose 网络的服务名；覆盖 backend/.env 的 localhost 默认值
      - MONGO_URL=mongodb://mongo:27017/icd
      # 服务器部署关闭 /docs、/redoc、/openapi.json
      - ICD_DOCS_ENABLED=0
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    # 容器内存上限：取值按 部署说明.md §5.4 算好后写进本目录的 .env
    # （ICD_MEM_LIMIT / ICD_MEMSWAP_LIMIT）；下面 ${...:-10g} 是「未执行 §5.4、
    # 未写本目录 .env 直接 compose up」时的默认上限（10 GB）。
    #
    # 为什么必须设：不设上限时容器与宿主共享内存，十万条级 EoICD 输入会把整机拖进
    # swap 抖动 —— SSH 与页面全部无响应，连「终止」都点不动，只能从容器外面杀进程。
    # 设上限后超限只在**容器内** OOM：宿主机始终可用，容器由 restart 策略自动拉起，
    # 任务变为「已中断」，用户在页面上「放弃」即可。
    # memswap_limit 与 mem_limit 相等 = 该容器不允许用 swap：宁可干脆失败，
    # 也不要「慢慢假死」。
    #
    # 注意：10 GB 默认值面向内存 ≥ 10 GB 的机器；物理内存更小时必须执行 §5.4
    # 按实际内存重算，否则上限形同虚设（把上限调到超过物理内存等于回到整机假死）。
    mem_limit: ${ICD_MEM_LIMIT:-10g}
    memswap_limit: ${ICD_MEMSWAP_LIMIT:-10g}

volumes:
  # 账号库持久化：删容器不丢账号；备份/恢复见 部署说明.md §7.5
  mongo_data:
