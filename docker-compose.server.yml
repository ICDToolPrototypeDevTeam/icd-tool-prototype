# 服务器单端口交付形态：一个后端容器提供 API 与前端页面，另加 Redis + Worker。
#
# 与本地开发用的 docker-compose.yml 的区别：
#   - 无 build 段：镜像在外部构建后 docker load 进来，服务器无需联网构建；
#   - 无前端容器：前端构建产物由后端同源托管（ICD_STATIC_DIR），对外只暴露 8182
#     一个端口（映射到容器内 8000；容器内服务端口不变）。
#
# 执行模型（自本版起）：
#   API（backend）    接请求、保存上传、写 job.json、把反向任务放进 Redis 队列；
#   Redis             队列 + 任务控制面（取消/终止/心跳租约），AOF 持久化；
#   Worker（worker）  独立容器，默认 20 个子进程并行跑反向管线；
#   共享卷            ./backend/output —— job.json / job.log / 产物。
#   API 重启不会丢队列；Worker 被 OOM 杀掉的任务由 API 侧 reaper 标为 interrupted，
#   用户可在页面上「继续」（从已落盘产物 + LLM 缓存续跑）。
#
# 使用前提（与仓库目录结构保持一致，交付时请原样带过去）：
#   frontend/dist/     前端构建产物（npm run build 生成）
#   backend/.env       模型服务配置
#   backend/output/    分析输出落盘目录
#   Redis 镜像         redis:7-alpine（服务器无外网，需随后端镜像一起离线载入）
#
# 部署步骤与验收方式见 部署说明.md。
#
# 独立项目名：避免与本地开发的 docker-compose.yml（项目名默认取目录名）互相覆盖容器。
name: icd-tool-server

services:
  redis:
    image: redis:7-alpine
    # 内网服务器无外网出口：镜像缺失时直接报错，而不是尝试联网拉取
    pull_policy: never
    command:
      - redis-server
      # AOF：API/Worker/Redis 一起重启后，队列里的任务仍在
      - --appendonly
      - 'yes'
      # 任务队列不允许被内存淘汰策略静默删除；内存不足时宁可写入失败
      - --maxmemory-policy
      - noeviction
    volumes:
      - icd-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${ICD_REDIS_MEM_LIMIT:-512m}
    memswap_limit: ${ICD_REDIS_MEM_LIMIT:-512m}

  backend:
    image: icd-tool-backend-v4.0
    # 内网服务器无外网出口：镜像缺失时直接报错，而不是尝试联网拉取
    pull_policy: never
    ports:
      # 宿主机 8182 → 容器内 8000（容器内 uvicorn 仍监听 8000）
      - '8182:8000'
    volumes:
      # 前端产物只读挂载，后端按 ICD_STATIC_DIR 同源托管
      - ./frontend/dist:/app/static:ro
      # 分析输出落宿主机，容器重建不丢（Worker 容器挂同一个目录）
      - ./backend/output:/app/output
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - ICD_STATIC_DIR=/app/static
      # 执行层：API 只入队，反向管线在 worker 容器执行
      - JOB_EXECUTOR=celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      # 正向尚未接入 Celery：入口保留，后端返回 503
      - FORWARD_PIPELINE_ENABLED=0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 容器内存上限：取值按 部署说明.md §5.4 算好后写进本目录的 .env
    # （ICD_MEM_LIMIT / ICD_MEMSWAP_LIMIT）；下面 ${...:-10g} 是「未执行 §5.4、
    # 未写本目录 .env 直接 compose up」时的默认上限（10 GB）。
    #
    # 为什么必须设：不设上限时容器与宿主共享内存，十万条级 EoICD 输入会把整机拖进
    # swap 抖动 —— SSH 与页面全部无响应，连「终止」都点不动，只能从容器外面杀进程。
    # 设上限后超限只在**容器内** OOM：宿主机始终可用，容器由 restart 策略自动拉起，
    # 任务变为「已中断」，用户在页面上「放弃」即可。
    # memswap_limit 与 mem_limit 相等 = 该容器不允许用 swap：宁可干脆失败，
    # 也不要「慢慢假死」。
    #
    # 注意：10 GB 默认值面向内存 ≥ 10 GB 的机器；物理内存更小时必须执行 §5.4
    # 按实际内存重算，否则上限形同虚设（把上限调到超过物理内存等于回到整机假死）。
    #
    # 本版新增 Worker 容器后，**两个容器的上限之和**不能超过物理内存：
    # API（轻负载，上传解析 + 轮询）与 Worker（重负载，20 个并行管线）分开限额。
    mem_limit: ${ICD_MEM_LIMIT:-10g}
    memswap_limit: ${ICD_MEMSWAP_LIMIT:-10g}

  worker:
    image: icd-tool-backend-v4.0
    pull_policy: never
    volumes:
      # 与 API 共享输出卷：job.json / job.log / 全部产物
      - ./backend/output:/app/output
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - JOB_EXECUTOR=celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FORWARD_PIPELINE_ENABLED=0
    # -c = 同时执行的反向任务数（每个子进程一个任务，不是线程）。
    # 默认 20；服务器核数/内存不足时在部署目录 .env 里调小
    # （ICD_WORKER_CONCURRENCY=8 等），不要直接改本文件。
    command:
      - celery
      - -A
      - app.execution.celery_app
      - worker
      - -Q
      - icd.reverse
      - -c
      - '${ICD_WORKER_CONCURRENCY:-20}'
      - -Ofair
      - --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 收到 docker stop 时给正在跑的任务留一点收尾时间；超时后 SIGKILL，
    # 未完成任务会被 API 侧 reaper 标为 interrupted，可继续。
    stop_grace_period: 30s
    # Worker 内存上限：必须与并发数一起算（见 部署说明.md §5.4）。
    # 20 个并行大任务的总峰值可能远超单任务，默认 10g 只是「未配置」时的兜底。
    mem_limit: ${ICD_WORKER_MEM_LIMIT:-10g}
    memswap_limit: ${ICD_WORKER_MEMSWAP_LIMIT:-10g}

volumes:
  icd-redis-data:
