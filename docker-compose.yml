version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend/app/output:/app/app/output
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      # 模型相关变量（真实值请在 backend/.env 中填写）
      - USE_MOCK_LLM=${USE_MOCK_LLM:-1}
      - CREWAI_VERBOSE=${CREWAI_VERBOSE:-0}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-}
      - MINIMAX_PROVIDER=${MINIMAX_PROVIDER:-}
      - MINIMAX_TEMPERATURE=${MINIMAX_TEMPERATURE:-}
      - MINIMAX_TOP_P=${MINIMAX_TOP_P:-}
      - MINIMAX_MAX_TOKENS=${MINIMAX_MAX_TOKENS:-}
      - MINIMAX_TIMEOUT=${MINIMAX_TIMEOUT:-}
      - MINIMAX_MAX_RETRIES=${MINIMAX_MAX_RETRIES:-}
      - MINIMAX_RETRY_BACKOFF=${MINIMAX_RETRY_BACKOFF:-}
      - MINIMAX_STREAM=${MINIMAX_STREAM:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - DEEPSEEK_PROVIDER=${DEEPSEEK_PROVIDER:-}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE:-}
      - DEEPSEEK_TOP_P=${DEEPSEEK_TOP_P:-}
      - DEEPSEEK_MAX_TOKENS=${DEEPSEEK_MAX_TOKENS:-}
      - DEEPSEEK_TIMEOUT=${DEEPSEEK_TIMEOUT:-}
      - DEEPSEEK_MAX_RETRIES=${DEEPSEEK_MAX_RETRIES:-}
      - DEEPSEEK_RETRY_BACKOFF=${DEEPSEEK_RETRY_BACKOFF:-}
      - DEEPSEEK_STREAM=${DEEPSEEK_STREAM:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      - VITE_PROXY_TARGET=http://host.docker.internal:8000
