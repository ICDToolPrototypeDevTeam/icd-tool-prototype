services:
  mongo:
    # 固定小版本，避免不同构建机拉到不同镜像；可用 MONGO_IMAGE 覆盖
    image: ${MONGO_IMAGE:-mongo:7.0.14}
    restart: unless-stopped
    # 仅绑定本机回环地址：方便在宿主机直接跑 uvicorn 调试（backend/.env 默认
    # MONGO_URL=mongodb://127.0.0.1:27017/icd）；容器内后端通过服务名 mongo 访问。
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: icd-tool-backend-v4.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend/output:/app/output
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      # 容器内后端走 compose 网络的服务名；覆盖 backend/.env 的 localhost 默认值
      - MONGO_URL=mongodb://mongo:27017/icd
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: icd-tool-frontend-v4.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      - VITE_PROXY_TARGET=http://backend:8000

volumes:
  mongo_data:
