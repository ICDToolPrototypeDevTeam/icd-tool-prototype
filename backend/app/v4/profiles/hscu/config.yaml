    - "HYD_Pressure"

# Auto-detection: used by coverage.py _detect_system_type to identify which
# profile matches an uploaded HLR Word file.
auto_detect:
  min_rows: 5
  required_cols: 2
  cell_patterns:
    "0":
      contains: "需求ID"
    "1":
      starts_with: "FSF29"

# HLR pre-processing — rewrites symbolic LBL_<name> references in HLR
# requirements.content to their octal-encoded EoICD form L<octal>_<name>.
#
# Background: HSCU HLR Word text uses symbolic LBL names (e.g. LBL_DIS_00_SYS1),
# but the EoICD blocks encode them with octal label numbers
# (e.g. L145_DIS_00_SYS1_T1A). Without rewriting, the reverse matcher's
# Stage1 label-prefix filter (LBL_DIS_00_SYS1/) never matches the EoICD blocks
# (which are keyed by L145_DIS_00_SYS1/), so the entire HSCU requirement set
# falls through to 0 matches.
#
# The hook appends "(alias: L<octal>_<name>)" annotations to requirement
# content so the AI labeler sees BOTH forms and emits labels in the octal form
# that the matcher recognizes. Original text is preserved for traceability.
#
# 扫描源为 content + rationale（基本原理）：模板式需求正文以 XXX 占位、具体
# 信号列在基本原理栏（"其中，XXX为以下信号：…"），仅扫正文时该类需求得不到
# 别名；别名仍只写入 content（标注环节与匹配器的 L 号路由键只从 content 取）。
# Reverse matcher knobs (opt-in per profile).
# See ``MatcherEnhancementConfig`` (profiles/base.py) for semantics.
matcher:
  enable_direction_soft_on_exact_signal: true  # keep dir-contradicting candidates when signal name matches

hlr_preprocess:
  enabled: true
  auto_parse_hlr_table_0: true    # auto-detect LBL catalog table in HLR Word; covers 12 labels (DIS_00_SYS1, DIS_03_INFO, QTY_SYS2, QTY_SYS3, PRESS_SYS1-3, TEMP_SYS1-3, PWR_CMD_HSCU, CONFIG_RPT)
  apply_to_fields:
    - "content"
  # —— 标签总览目录表识别/解析参数（表头语义列定位）——
  # 表级：>=min_columns 列、>=min_rows 行、>=1 行同时含 LBL_* 与 octal 样值；
  # 列级：表头行（前 3 行中角色命中最多的行）关键字 → 最左命中列；
  # name/octal 为核心角色（命中则严格按列取值，否则退回行内扫描），
  # sdi/ssm/signal 为增强角色（定位不了不猜，只进日志不进 parse_warnings）。
  label_catalog:
    min_columns: 3
    min_rows: 2
    header_keywords:
      name: ["LABEL名称", "标签名称"]
      octal: ["LABEL号", "标签号"]
      sdi: ["SDI"]
      ssm: ["SSM"]
      signal: ["信号名称", "信号名"]
    channel_suffix_pattern: "_R\\d+$"
  # extra_mappings act as fallback / override on top of auto-parsed ones.
  # The auto-parsed table covers the 4 known-to-HSCU labels plus 8 additional
  # ones; explicit mappings here are kept for safety / forward-compatibility.
  extra_mappings:
    LBL_DIS_00_SYS1: "145"