    - "接收"
    - "采集"
    - "解析"
    - "获取"
    - "读取"
    - "监测"
    - "判断"
    - "检测"
    - "输入"

traceability:
  table1:
    filename_patterns:
      - "附件1*需求*ICD*.xlsx"
      - "*追溯*.xlsx"
    sheet_match:
      by_name_keywords:
        - "待填_需求接口追溯表"
        - "需求接口追溯"
        - "需求_设备接口追溯表"
      fallback_index: 1
    columns:
      erd: 3
      icd_fullname: 7
  table2:
    filename_patterns:
      - "*液压*单模块需求矩阵*.xlsx"
      - "*矩阵分析*.xlsx"
      - "*需求矩阵*.xlsx"
    sheet_match:
      by_name_keywords:
        - "Sheet1"
        - "矩阵"
      fallback_index: 0
    columns:
      erd: 0
      hlr: 3
      module: 4
    skip_module: []
    # HSCU Sheet1: row 1 = 当前需求文档/下层需求文档 (merged), row 2 =
    # 需求编号/模块名称/需求内容/.../链接类型 (column headers); data starts
    # at row 3. Matches FGMC's data_start_row=2 convention.
    data_start_row: 2

