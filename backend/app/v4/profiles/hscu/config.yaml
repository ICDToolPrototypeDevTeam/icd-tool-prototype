profile:
  id: hscu
  display_name: 液压系统控制单元 (HSCU)
  version: 1.0

hlr_parser:
  glossary_table_index: 0
  glossary_header_keywords: ["缩略语", "缩写"]
  filter_non_requirement: false
  field_map:
    id:
      - "需求ID"
    content:
      - "需求正文"
      - "需求中文"
      - "需求描述"
    object_type:
      - "对象类型"
    is_derived:
      - "是否衍生"
    rationale:
      - "基本原理"
      - "需求原理"
    is_safety_related:
      - "安全相关"
      - "是否安全性相关"
    verification_method:
      - "验证方法"
    implementation:
      - "实现方法"
  # —— 整篇文档适配维度（默认关闭 = 现状行为；本 profile 显式打开）——
  # 术语表定位：关键字全表扫描（不依赖固定表索引；未命中 → 术语表为空，
  # 且不再与需求表扫描范围挂钩）。
  glossary_locate:
    mode: keyword_scan
  # 需求表识别：全表扫描（需求表与目录表/术语表位置解耦）+ id 值形态校验
  # （^FSF29 为 HSCU 需求 ID 前缀约定）+ 跳过登记（写入 parse_warnings）。
  requirement_scan:
    mode: all_tables
    id_pattern: "^FSF29"
    register_skipped: true
    warn_min_rows: 5

