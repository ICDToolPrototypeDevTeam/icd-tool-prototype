    - "压力"
    - "流量"
    - "油温"
    - "油量"
    - "温度"
    - "转速"
    - "位移"
  discrete:
    - "微动"
    - "开关"
    - "[Tt]rue"
    - "[Ff]alse"
    - "故障"
    - "跳变"
    - "触点"
    - "离散量"
    - "开关量"
    - "BOOL"
    - "BOOLEAN"
    - "DISCRETE"
    - "状态位"
    - "有效位"
    - "阀门状态"
    - "阀"
    - "泵"
  bus:
    - "CAN"
    - "A825"
    - "A664"
    - "A429"
    - "AFDX"
    - "总线"
    - "ARINC"
    - "通信"
    - "接收"
    - "发送"
    - "写入"
    - "采集"
    - "解析"
    - "RS485"
    - "RS422"
  direction_send:
    - "发送"
    - "写入"
    - "输出"
    - "上报"
    - "发布"
    - "驱动"
    - "设置"
    - "控制"
