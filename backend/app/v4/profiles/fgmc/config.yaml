traceability:
  table1:
    filename_patterns:
      - "*追溯*.xlsx"
      - "*接口基线*.xlsx"
    sheet_match:
      # Issue #74 follow-up (FGMC): the FGMC traceability workbook contains
      # both a current ``待填_需求接口追溯表`` sheet and an obsolete
      # ``接口基线表_EoICD_old_待删除`` sheet that also matches the broad
      # ``接口基线`` substring. ``_select_sheet`` picks the first keyword
      # hit, so we list the specific current-sheet name first to avoid the
      # obsolete sheet. AMS/HSCU/RPDU profiles are not affected — they
      # have their own config.yaml.
      by_name_keywords:
        - "待填_需求接口追溯表"
        - "追溯"
        - "接口基线表_EoICD"
      fallback_index: 0
    columns:
      erd: 3
      icd_fullname: 7
  table2:
    filename_patterns:
      - "*矩阵分析*.xlsx"
      - "*需求矩阵*.xlsx"
    sheet_match:
      by_name_keywords:
        - "Sheet1"
        - "矩阵"
      fallback_index: 0
    columns:
      erd: 0
      hlr: 3
      module: 4
    skip_module: []
    # FGMC Sheet1 has row 1 ('当前需求文档/下层需求文档') and row 2
    # ('需求ID/模块名称/模块需求'); data starts at row 3.
    # Note: data_start_row uses the same semantics as the internal
    # `data_start` variable (1-indexed count of header rows), so
    # data_start_row=2 produces min_row=3 which picks up the first
    # actual data row. Using 1 would also pick up row 2 (the column
    # header) and introduce a fake parent '需求ID'.
    data_start_row: 2

