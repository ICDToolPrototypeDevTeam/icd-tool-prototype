      - "需求中文"
      - "Description"
    code:
      - "需求编号"
      - "RequirementCode"
    object_type:
      - "对象类型"
      - "Type"
    is_derived:
      - "是否衍生"
      - "IsDerived"
    rationale:
      - "需求原理"
      - "基本原理"
      - "Rationale"
    is_safety_related:
      - "是否安全性相关"
      - "安全相关"
      - "SafetyRelated"
    verification_method:
      - "验证方法"
      - "VerificationMethod"
    implementation:
      - "实现方法"
      - "ImplementationMethod"
    source:
      - "需求来源"
      - "Source"
    covered_ids:
      - "覆盖的需求ID"
      - "CoveredIds"
    notes:
      - "注释"
      - "Notes"
    is_requirement:
