profile:
  id: fgmc
  display_name: 燃油测量管理计算机 (FGMC)
  version: 1.0

hlr_parser:
  glossary_table_index: 1
  requirement_table_min_rows: 12
  filter_non_requirement: true
  non_requirement_value: "否"
  field_map:
    id:
      # Issue #74 follow-up (FGMC): FGMC HLR tables carry two ID columns —
      # row 0 ``ID`` holds an internal docx sequence number (e.g. 1781)
      # and row 1 ``需求编号`` holds the official HLR identifier
      # (e.g. ``FGMC_OFP_CSCI_HLR_005906``) that the traceability tables
      # reference. Picking up ``ID`` produced identifiers that never match
      # Table 2's child column, so Group A stayed 0. ``需求编号`` is now
      # the primary alias; ``ID`` is kept as a fallback for any legacy
      # docx that lacks the row 1 header.
      - "需求编号"
      - "ID"
      - "RequirementID"
      - "需求ID"
    content:
      - "需求描述"
      - "需求中文"
      - "Description"
    code:
      # ``需求编号`` deliberately omitted here. ``_build_field_map_index``
      # stores one std_field per header text, so listing ``需求编号`` under
      # both ``id`` and ``code`` would let whichever field is iterated
      # last win — and for FGMC the official HLR identifier
      # (``FGMC_OFP_CSCI_HLR_005906``) lives at the ``需求编号`` row of
      # every HLR table and MUST be picked up by ``id`` so the trace
      # chain (HLR→ERD→ICD) can match Table 2's child column. Keep
      # ``RequirementCode`` as the legacy alias for any other controller.
      - "RequirementCode"
    object_type:
      - "对象类型"
      - "Type"
    is_derived:
      - "是否衍生"
      - "IsDerived"
    rationale:
      - "需求原理"
      - "基本原理"
      - "Rationale"
    is_safety_related:
      - "是否安全性相关"
      - "安全相关"
      - "SafetyRelated"
    verification_method:
      - "验证方法"
      - "VerificationMethod"
    implementation:
      - "实现方法"
      - "ImplementationMethod"
    source:
      - "需求来源"
      - "Source"
    covered_ids:
      - "覆盖的需求ID"
      - "CoveredIds"
    notes:
      - "注释"
      - "Notes"
    is_requirement:
      - "是否为需求"
    input_data:
      - "输入数据"
      - "InputData"
    output_data:
      - "输出数据"
      - "OutputData"

