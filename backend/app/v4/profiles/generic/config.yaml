profile:
  id: generic
  display_name: 其他系统（通用）
  version: 0.1

# 通用系统：HLR 表格解析完全由用户自定义表格样式驱动，下游使用中性默认配置。
# 没有 auto_detect —— 自动识别只在内置四个控制器中匹配，通用系统由用户显式选择，
# 且必须同时提供自定义表格样式（由 coverage API 校验）。
hlr_parser:
  # 不使用固定索引的术语表兜底：通用文档的表 0 可能是封面、修订记录等。
  # 真正的术语表仍由解析器的表头语义检测识别。
  glossary_table_index: 9999
